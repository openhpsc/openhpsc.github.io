<div class="oh-theme-picker pst-js-only" role="group" aria-label="Color theme">
  <button type="button" class="theme-change-button" data-mode="light" aria-label="Light theme" title="Use light theme">Light</button>
  <button type="button" class="theme-change-button" data-mode="dark" aria-label="Dark theme" title="Use dark theme">Dark</button>
  <button type="button" class="theme-change-button" data-mode="auto" aria-label="System theme" title="Follow your system appearance">System</button>
</div>
